name: CI - Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v0.1.0). Leave empty to publish 'latest'."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

# One release run at a time: the snapshot-agent build pulls the gpu-cr image
# by tag, so an overlapping run could swap 'latest' underneath it.
concurrency:
  group: ci-release
  cancel-in-progress: false

jobs:
  # GPU-CR artifact package: cr_client + vGPU-NVIDIA.so built as a
  # version-locked pair from third_party/gpu-cr (see the Dockerfile).
  # x86_64-only, matching the snapshot-agent that consumes cr_client. Built
  # first: the snapshot-agent copies cr_client from this run's push (the same
  # tag workloads take vGPU-NVIDIA.so from), never from an earlier 'latest'.
  gpu-cr:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Determine tag
        id: tag
        env:
          # Read via env, not template interpolation, so the input can't be
          # rendered into Bash source; validated as a Docker tag below.
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "${VERSION}" && ! "${VERSION}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag: ${VERSION}" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${VERSION}" ]]; then
            # Manual versioned release: publish only the requested tag,
            # leave 'latest' to main-branch builds.
            printf 'tag=%s\nprerelease=true\n' "${VERSION}" >> "$GITHUB_OUTPUT"
          else
            # Every main merge (and tag-less manual runs) publishes 'latest'.
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Build and push
        uses: ./.github/actions/docker-build-and-push
        with:
          image-name: gpu-cr
          dockerfile: docker/gpu-cr/Dockerfile
          platforms: linux/amd64
          registry: ghcr.io/${{ github.repository }}
          tag: ${{ steps.tag.outputs.tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ steps.tag.outputs.prerelease }}

      - name: Trivy security scan
        uses: ./.github/actions/trivy-scan
        with:
          image: ghcr.io/${{ github.repository }}/gpu-cr:${{ steps.tag.outputs.tag }}

  docker-build-and-push:
    needs: gpu-cr
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Single-platform (amd64) for all components: the platform is adopted
          # as a unit, and the snapshot-agent is x86_64-only today (cuda-checkpoint
          # binary + CGO build). Revisit both together when an aarch64
          # cuda-checkpoint is available.
          - component: timesliceorchestrator
            dockerfile: docker/timesliceorchestrator/Dockerfile
            platforms: linux/amd64
          - component: snapshot-agent
            dockerfile: docker/snapshot-agent/Dockerfile
            platforms: linux/amd64
            build-args: GPU_CR_IMAGE=ghcr.io/${{ github.repository }}/gpu-cr:${{ needs.gpu-cr.outputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build and push
        uses: ./.github/actions/docker-build-and-push
        with:
          image-name: ${{ matrix.component }}
          dockerfile: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          registry: ghcr.io/${{ github.repository }}
          tag: ${{ needs.gpu-cr.outputs.tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ needs.gpu-cr.outputs.prerelease }}
          build-args: ${{ matrix.build-args }}

      - name: Trivy security scan
        uses: ./.github/actions/trivy-scan
        with:
          image: ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ needs.gpu-cr.outputs.tag }}
