# One-shot GPU pod running the e2e correctness gates and the perf-regression
# suite against upstream GPU-CR (e9bbb52).
#
#   1. Build the candidate e2e image (the GPU-free suites run as a build gate)
#      and push it to a registry your cluster can pull from:
#        docker build -f Dockerfile.build --target e2e \
#            --build-arg SHM_SIZE_GB=5 -t <registry>/gpucr-e2e:<tag> .
#      SHM_SIZE_GB=5 keeps a library without runtime buffer sizing inside
#      this pod's 16Gi hugepage request (the compile-time default is
#      25 GiB); builds that honor GPU_CR_SHM_MB may keep the default.
#   2. Build baseline once: tests/e2e/build_baseline_so.sh
#   3. Point the images below at your registry, then:
#        kubectl apply -f tests/e2e/e2e-pod.yaml
#        kubectl logs -f gpu-cr-e2e
#      Pod exits 0 only if every e2e gate AND the perf gate pass.
#
# Expects a pre-existing Kubernetes cluster with a node exposing 1 GPU and
# 2Mi hugepages. PERF_* sizing below fits a node with 16GiB of 2Mi
# hugepages; scale up on bigger nodes for steadier bandwidth numbers.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-cr-e2e
spec:
  restartPolicy: Never
  volumes:
  - name: huge-ckpt
    emptyDir:
      medium: HugePages-2Mi
  - name: ctl
    emptyDir:
      medium: Memory
  - name: baseline
    emptyDir: {}
  initContainers:
  - name: fetch-baseline
    # Artifact-carrier image produced by tests/e2e/build_baseline_so.sh
    image: asia-southeast1-docker.pkg.dev/PROJECT_ID/time-slicing/gpucr-so:baseline-e9bbb52-shm5
    imagePullPolicy: Always
    command: [sh, -c, "cp /vGPU-NVIDIA.so /baseline/ && cp /cr_client /baseline/"]
    securityContext:
      allowPrivilegeEscalation: false
    volumeMounts:
    - {name: baseline, mountPath: /baseline}
  containers:
  - name: e2e
    # e2e stage of Dockerfile.build for the candidate tag:
    #   docker build -f Dockerfile.build --target e2e -t .../gpucr-e2e:<tag> .
    image: asia-southeast1-docker.pkg.dev/PROJECT_ID/time-slicing/gpucr-e2e:CANDIDATE_TAG
    imagePullPolicy: Always
    command: [bash, -c]
    args:
    - |
      set -e
      export STORE=/mnt/huge-ckpt
      # Env-configured ctl mode for the main pass; the tmpfs is mounted
      # NESTED at $STORE/ctl (production layout), so the G8 gate can prove
      # zero-config discovery against the very same backing.
      export GPU_CR_CTL_PATH=/mnt/huge-ckpt/ctl
      /opt/gpu-cr/e2e/run_e2e.sh
      unset GPU_CR_CTL_PATH
      /opt/gpu-cr/e2e/perf_regression.sh \
          --baseline-so /baseline/vGPU-NVIDIA.so \
          --baseline-client /baseline/cr_client \
          --candidate-so "$VGPU_SO" \
          --candidate-client "$CR_CLIENT" \
          --iters "${PERF_ITERS:-5}" --threshold-pct "${PERF_THRESHOLD_PCT:-15}"
    env:
    - {name: PERF_NUM_BUFFERS, value: "8"}
    - {name: PERF_BUFFER_MB, value: "512"}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        add: [SYS_PTRACE]
    resources:
      requests:
        hugepages-2Mi: 16Gi
        memory: 8Gi
        cpu: "8"
      limits:
        nvidia.com/gpu: 1
        hugepages-2Mi: 16Gi
        memory: 8Gi
    volumeMounts:
    # ctl nests INSIDE the store (production layout for zero-config
    # discovery); keep huge-ckpt listed first so the runtime mounts the
    # parent before the nested path.
    - {name: huge-ckpt, mountPath: /mnt/huge-ckpt}
    - {name: ctl, mountPath: /mnt/huge-ckpt/ctl}
    - {name: baseline, mountPath: /baseline}
